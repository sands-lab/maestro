apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: local-main-agent
spec:
  description: The main orchestrator that delegates tasks to specialized sub-agents.  A local sub-agent that handles dice rolling operations.
  type: BYO
  byo:
    deployment:
      image: 10.140.0.2:5001/local_main_agent:latest
      imagePullPolicy: Always
      env:
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: kagent-google
              key: GOOGLE_API_KEY
