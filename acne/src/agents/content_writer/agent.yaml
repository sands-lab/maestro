apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: content-writer-agent
spec:
  description: Writes content based on a provided plan or simple story abstraction.
  type: BYO
  byo:
    deployment:
      image: 10.140.0.2:5001/content_writer_agent:latest
      imagePullPolicy: Always
      env:
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: kagent-google
              key: GOOGLE_API_KEY
