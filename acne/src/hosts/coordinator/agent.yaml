apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: coordinator-agent
spec:
  description: Host UI and coordinator that routes content creation tasks to planner/writer/editor agents.
  type: BYO
  byo:
    deployment:
      image: 10.140.0.2:5001/coordinator-agent:latest
      imagePullPolicy: Always
      env:
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: kagent-google
              key: GOOGLE_API_KEY
